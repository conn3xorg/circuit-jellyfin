name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # On Rocky Linux and Fedora, Podman in the host container needs a
          # rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The example's secrets reach the host write-only, so state holds
      # none of them, and nothing Conn3x writes under .terraform does either.
      # .terraform/modules is left out: it holds downloaded module code.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          if grep -rqF --exclude-dir=modules -e correct-horse-battery terraform.tfstate .terraform/; then
            echo "A secret from the example is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # Runs twice, the second time after a restart, which must keep the
      # port, the finished wizard and the admin.
      - name: Check health, the public info, the admin login, and a restart
        run: |
          sudo podman exec -i circuit-jellyfin sh -eu <<'EOF'
          u=http://127.0.0.1:8097
          auth='Authorization: MediaBrowser Client="ci", Device="ci", DeviceId="ci", Version="1"'
          check() {
            for _ in $(seq 60); do [ "$(curl -s $u/health)" = Healthy ] && break; sleep 2; done
            [ "$(curl -s $u/health)" = Healthy ]
            curl -sf $u/System/Info/Public | grep -q '"StartupWizardCompleted":true'
            curl -sf -H 'Content-Type: application/json' -H "$auth" -d '{"Username":"admin","Pw":"correct-horse-battery"}' $u/Users/AuthenticateByName | grep -q '"AccessToken"'
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "$auth" -d '{"Username":"admin","Pw":"wrong-password"}' $u/Users/AuthenticateByName)" = 401 ]
          }
          check
          systemctl restart jellyfin
          check
          EOF
      - name: Plan again after the restart
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: A link at network.xml leaves where it points as it was
        working-directory: examples/local
        run: |
          sudo podman exec circuit-jellyfin sh -ec '
            d=/etc/jellyfin
            [ -d "$d" ] || d=/var/lib/jellyfin/config
            cp "$d/network.xml" /root/network.xml
            rm "$d/network.xml"
            ln -s /root/link-target "$d/network.xml"
          '
          conn3x apply -auto-approve || true
          sudo podman exec circuit-jellyfin sh -ec '
            [ ! -e /root/link-target ]
            d=/etc/jellyfin
            [ -d "$d" ] || d=/var/lib/jellyfin/config
            rm "$d/network.xml"
            install -o jellyfin -g jellyfin -m 0644 /root/network.xml "$d/network.xml"
          '
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Another process on the port gets no password
        working-directory: examples/local
        run: |
          sudo podman exec circuit-jellyfin sh -ec '
            command -v python3 >/dev/null || { apt-get -qq update && apt-get -qq install -y python3 || dnf -q install -y python3; } >/dev/null
            systemctl stop jellyfin
            d=/etc/jellyfin; [ -d $d ] || d=/var/lib/jellyfin/config; sed -i "s,<IsStartupWizardCompleted>true,<IsStartupWizardCompleted>false," $d/system.xml
          '
          sudo podman exec -d circuit-jellyfin sh -c 'cd /tmp && exec runuser -u nobody -- python3 -m http.server --bind 127.0.0.1 8097 > /tmp/listener.log 2>&1'
          sleep 3
          if conn3x apply -auto-approve; then echo "apply should have refused" >&2; exit 1; fi
          sudo podman exec circuit-jellyfin sh -ec '
            pkill -f [h]ttp.server || true
            ! grep -q Startup /tmp/listener.log
          '
      - name: Check an image, where there is one, is by digest
        run: |
          sudo podman exec circuit-jellyfin sh -c 'for f in /etc/containers/systemd/jellyfin.container; do [ ! -f "$f" ] || grep -q "^Image=.*@sha256:" "$f"; done'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
